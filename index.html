.why{background:#173b2e;color:white}

.why p{color:#dbe7e1}
.contact{background:#f7e8eb;text-align:center}

textarea{height:120px}
button{border:0;cursor:pointer;font-size:15px}
footer{background:#102a21;color:white;text-align:center;padding:25px}
